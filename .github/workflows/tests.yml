name: Test Suite

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1
  PIP_PROGRESS_BAR: off
  PYTHONUNBUFFERED: 1

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.9', '3.10', '3.11', '3.12' ]
    env:
      PYTEST_ADDOPTS: >-
        --log-dir=/tmp/ci-logs
        --log-file=/tmp/ci-logs/pytest.log
        --showlocals
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
      with:
        egress-policy: audit

    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        cache: pip
        python-version: ${{ matrix.python-version }}

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.21.0'

    - run: make install-dev
    - run: make unit-tests
      env:
        COVERAGE_FILE: ".coverage.${{ matrix.python-version }}"
        PYTEST_ARGS: "--cov=karapace --cov-append --numprocesses 4"
    - run: make integration-tests
      env:
        COVERAGE_FILE: ".coverage.${{ matrix.python-version }}"
        PYTEST_ARGS: "--cov=karapace --cov-append --random-order --numprocesses 4"

    - name: Archive logs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: ${{ always() }}
      with:
        name: karapace-integration-test-logs-${{ matrix.python-version }}
        path: /tmp/ci-logs
    - name: Archive coverage file
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: "coverage-${{ matrix.python-version }}"
        path: ".coverage.${{ matrix.python-version }}"
        include-hidden-files: true

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      pull-requests: write
      contents: write
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
      with:
        egress-policy: audit

    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - run: make install-dev

    - name: Download coverage
      id: download_coverage
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: coverage-*
        merge-multiple: true

    - name: Post coverage comment
      id: post_coverage_comment
      uses: py-cov-action/python-coverage-comment-action@7188638f871f721a365d644f505d1ff3df20d683 # v3.40
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        MERGE_COVERAGE_FILES: true

    - name: Store PR comment to be posted
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: steps.post_coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
      with:
        name: python-coverage-comment-action
        path: python-coverage-comment-action.txt
